version: '3.8'

services:
  web:
    build: .
    container_name: lenny_growth_assistant
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://lenny_user:lenny_secret_password@postgres:5432/lenny_assistant_db
      - DEFAULT_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./embeddings:/app/embeddings

  postgres:
    image: postgres:16-alpine
    container_name: lenny_postgres
    restart: always
    environment:
      POSTGRES_USER: lenny_user
      POSTGRES_PASSWORD: lenny_secret_password
      POSTGRES_DB: lenny_assistant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny_user -d lenny_assistant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
